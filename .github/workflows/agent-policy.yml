name: Agent and commit policy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  agent-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v0.26.9
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
          pip install pre-commit invoke
      - name: Run all hooks
        run: pre-commit run --all-files
      - name: Guard regression tests
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts -p 'test_check_*.py' -v
      - name: Check new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          message=$(mktemp)
          trap 'rm -f "$message"' EXIT
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            commits=$(git rev-list -1 "$HEAD_SHA")
          else
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          fi
          for commit in $commits; do
            git show -s --format=%B "$commit" > "$message"
            pre-commit run --hook-stage commit-msg --commit-msg-filename "$message"
          done
