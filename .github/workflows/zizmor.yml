name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    # While the repository is private, code scanning is unavailable, so the
    # SARIF upload fails. zizmor reports in the log instead and still fails
    # the job on a finding. At publication, set advanced-security back to
    # true (or remove it) and restore `security-events: write`.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
