default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Generated by `tree-sitter generate` (or the playground build): checked by
# the tree-sitter-generated hook below, never formatted or gated by hand.
exclude: ^(src/(parser\.c|grammar\.json|node-types\.json|tree_sitter/)|docs/js/|.*\.wasm$)

repos:
  # A hook whose files: pattern matches nothing is skipped, and a skipped
  # gate reads as passed. check-hooks-apply fails when a hook below applies
  # to no file in the repository; check-useless-excludes when an exclude
  # matches nothing.
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Grammar test inputs are documents as written; their trailing
        # spaces are part of what the tests read.
        exclude: ^test/
      - id: end-of-file-fixer
        exclude: ^test/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # The same ruff version and checks as CI's python job. pyproject.toml
  # leaves scripts/ out of formatting (the shared guard scripts).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff-check

  - repo: local
    hooks:
      # The generated parser must match grammar.js. `invoke generate` checks
      # the tree-sitter CLI's version first: another version writes a
      # different parser.c.
      # Both run on every commit: the top-level exclude hides the generated
      # files, so a commit that edits only them would otherwise skip the
      # drift check.
      - id: tree-sitter-generated
        name: tree-sitter generate (src/ is current)
        entry: bash -c 'invoke generate && git diff --exit-code -- src/'
        language: system
        always_run: true
        pass_filenames: false

      - id: tree-sitter-test
        name: tree-sitter test (grammar corpus)
        entry: bash -c 'invoke generate >/dev/null && "${TREE_SITTER:-tree-sitter}" test'
        language: system
        always_run: true
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # The hand-written scanner is C we maintain: formatted by moldy and gated
  # by knots and aurora-lint like our other C. Re-pin a tool by changing its
  # rev or version here; regenerate a baseline in the same commit when the
  # tool's counting or findings change.
  - repo: https://github.com/brandon-arrendondo/moldy
    rev: v0.7.2
    hooks:
      - id: moldy
        files: ^src/(scanner\.c|tree_sitter_rst/.*\.[ch])$

  # Thresholds are the BRULE complexity limits (BRULE-025, -028, -031,
  # -041, -077) used in our C projects. --baseline ratchets every metric
  # against the committed snapshot: a new function must meet the limits and
  # an existing one may not get worse. Regenerate with --write-baseline only
  # when a function is fixed or knots' counting changes.
  - repo: https://github.com/brandon-arrendondo/knots
    rev: v2.0.0
    hooks:
      - id: knots
        args:
          - --mccabe-threshold=15
          - --cognitive-threshold=15
          - --nesting-threshold=5
          - --sloc-threshold=50
          - --abc-threshold=20.0
          - --return-threshold=3
          - --aird-threshold=85
          - --baseline=conf/knots_baseline.json
        files: ^src/(scanner\.c|tree_sitter_rst/.*\.[ch])$

  # clang-tidy and cppcheck, as upstream ran them (make lint).
  - repo: local
    hooks:
      - id: c-lint
        name: clang-tidy and cppcheck
        entry: make lint
        language: system
        files: ^src/(scanner\.c|tree_sitter_rst/.*\.[ch])$
        pass_filenames: false

  # CERT C analysis. pre-commit cargo-installs exactly this version into the
  # hook's environment and never runs an aurora-lint on PATH. The findings
  # present when the gate was adopted are recorded, not yet reviewed, in
  # conf/aurora-lint-suppress.toml; any other finding fails.
  - repo: local
    hooks:
      - id: aurora-lint
        name: aurora-lint (CERT C)
        entry: bash -c 'set -o pipefail; aurora-lint src -I src -m conf/aurora-lint-rules.toml --suppress-file conf/aurora-lint-suppress.toml --fail-on-violation | tail -40'
        language: rust
        additional_dependencies: ["cli:aurora-lint:0.7.0"]
        pass_filenames: false
        files: ^src/(scanner\.c|tree_sitter_rst/.*\.[ch])$

  - repo: local
    hooks:
      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p test_check_*.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_|test_check_).*\.py$
