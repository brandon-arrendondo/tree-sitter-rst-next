[package]
name = "tree-sitter-rst-next"
description = "reStructuredText grammar for tree-sitter"
version = "0.2.0"
authors = ["Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "rst"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/brandon-arrendondo/tree-sitter-rst-next"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
# The crate is imported as tree_sitter_rst, so it replaces the original
# package without code changes.
name = "tree_sitter_rst"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
